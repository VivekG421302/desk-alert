<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Desk Alert Bridge</title>
  <link id="favicon" rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3C/svg%3E" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="icons.js"></script>
  <style>
    :root { color-scheme: dark; }
    body { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
    button { -webkit-tap-highlight-color: transparent; }
    svg.i { width: 22px; height: 22px; fill: currentColor; display: block; }

    /* ---- incoming-call flash ---- */
    @keyframes callFlash { 0%,100% { background-color: #dc2626; box-shadow: 0 0 0 0 rgba(239,68,68,.8); } 50% { background-color: #7f1d1d; box-shadow: 0 0 0 14px rgba(239,68,68,0); } }
    .call-flash { animation: callFlash .9s ease-in-out infinite; border-color: #fecaca !important; color: #fff; }
    @keyframes slideIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
    .slide-in { animation: slideIn .25s ease-out; }
    @media (prefers-reduced-motion: reduce) { .call-flash { animation: none; background-color: #dc2626; } .slide-in { animation: none; } }

    /* ---- toolbar: icon toggle buttons ---- */
    .tbtn { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 14px; background: #17181c; border: 1px solid #2a2b31; color: #cbd5e1; flex: none; font-weight: 700; font-size: 15px; }
    .tbtn:hover { background: #202228; }
    .tbtn.on { background: #3730a3; border-color: #4f46e5; color: #fff; }
    .tbtn.off { color: #64748b; }
    @media (max-width: 480px) { .tbtn { width: 38px; height: 38px; border-radius: 12px; } .tsep { display: none; } svg.i { width: 20px; height: 20px; } }
    .tbtn.danger:hover { background: #7f1d1d; border-color: #b91c1c; color: #fff; }

    /* ---- containers ---- */
    .items { display: flex; flex-direction: column; gap: .5rem; }
    #app[data-view="grid"] .items { display: grid; gap: .6rem; align-items: start; }
    #app[data-view="grid"][data-size="L"] .items { grid-template-columns: repeat(auto-fill, minmax(21rem, 1fr)); }
    #app[data-view="grid"][data-size="M"] .items { grid-template-columns: repeat(auto-fill, minmax(16rem, 1fr)); }
    #app[data-view="grid"][data-size="S"] .items { grid-template-columns: repeat(auto-fill, minmax(12.5rem, 1fr)); gap: .45rem; }

    /* ---- notification card (Android-shade style) ---- */
    .card { position: relative; display: flex; gap: .8rem; align-items: flex-start; background: #17181c; border: 1px solid #26272d; border-radius: 1.4rem; padding: .85rem 1rem; min-width: 0; touch-action: pan-y; }
    .card.is-new { border-color: #4338ca; box-shadow: inset 3px 0 0 #6366f1; }
    .card.is-missed { background: #1c0d0e; border-color: #7f1d1d; }
    .card .ico { flex: none; width: 40px; height: 40px; margin-top: 2px; }
    .card .ico svg { width: 100%; height: 100%; display: block; }
    .card .body { min-width: 0; flex: 1; }
    .card .head { display: flex; align-items: center; gap: .4rem; font-size: .8rem; color: #9aa0ad; min-height: 28px; }
    .card .head .app { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card .head .time { white-space: nowrap; }
    .card .head .sp { flex: 1; }
    .card .dot { width: .5rem; height: .5rem; border-radius: 9999px; background: #34d399; flex: none; }
    .ibtn { width: 28px; height: 28px; border-radius: 9999px; display: grid; place-items: center; background: #2a2b31; color: #cbd5e1; flex: none; }
    .ibtn:hover { background: #3a3c44; }
    .ibtn svg.i { width: 18px; height: 18px; }
    .card .del { opacity: 0; transition: opacity .12s; }
    .card:hover .del, .card:focus-within .del { opacity: 1; }
    .card .del:hover { background: #b91c1c; color: #fff; }
    @media (hover: none) { .card .del { display: none; } }
    .card .title { font-size: 1.05rem; font-weight: 600; color: #f1f5f9; overflow-wrap: anywhere; line-height: 1.3; }
    .card .msg { margin-top: .1rem; font-size: .92rem; color: #c7ccd6; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.35; }
    .card .actions { display: flex; gap: 1.4rem; margin-top: .65rem; }
    .card .act { color: #b9bcff; font-weight: 600; font-size: .92rem; padding: .15rem 0; }
    .card .act:hover { text-decoration: underline; }
    .card .act.warn { color: #fca5a5; }
    .card.call-flash .head, .card.call-flash .msg, .card.call-flash .title { color: #fff; }

    /* collapsed text by size (open cards always show everything) */
    #app[data-size="S"] .card:not(.open) .title, #app[data-size="S"] .card:not(.open) .msg { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
    #app[data-size="M"] .card:not(.open) .title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #app[data-size="M"] .card:not(.open) .msg { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    #app[data-size="S"] .card { padding: .5rem .75rem; gap: .6rem; border-radius: 1rem; }
    #app[data-size="S"] .card .ico { width: 30px; height: 30px; }
    #app[data-size="S"] .card .title { font-size: .92rem; }
    #app[data-size="S"] .card .msg { font-size: .82rem; }
    #app[data-size="S"] .card .head { min-height: 22px; font-size: .72rem; }
    #app[data-size="M"] .card { padding: .65rem .85rem; }
    #app[data-size="M"] .card .ico { width: 34px; height: 34px; }
    #app[data-view="grid"][data-size="L"] .card:not(.open) .msg { display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
    .tray-body .card .app, .tray-body .card .sep { display: none; }

    /* ---- reply panel ---- */
    .replypanel { margin-top: .6rem; }
    .chips { display: flex; flex-wrap: wrap; gap: .4rem; }
    .chip { border: 1px solid #3b3d6b; background: #1d1f3a; color: #c9ccff; border-radius: 9999px; padding: .28rem .75rem; font-size: .85rem; }
    .chip:hover { background: #2a2d57; }
    .chip:disabled { opacity: .5; }
    .rrow { display: flex; gap: .5rem; margin-top: .5rem; }
    .rrow input { flex: 1; min-width: 0; border-radius: .8rem; background: #0f1014; border: 1px solid #2f3038; padding: .45rem .75rem; font-size: .92rem; color: #f1f5f9; outline: none; }
    .rrow input:focus { border-color: #6366f1; }
    .rrow button { border-radius: .8rem; background: #059669; color: #fff; font-weight: 600; padding: .45rem .9rem; font-size: .9rem; }
    .rrow button:disabled { opacity: .5; }
    .rstatus { font-size: .75rem; color: #94a3b8; margin-top: .3rem; min-height: 1em; }

    /* ---- trays ---- */
    .tray { border: 1px solid #26272d; background: #101116; border-radius: 1.4rem; overflow: hidden; }
    .tray-head { display: flex; align-items: center; gap: .6rem; padding: .6rem .8rem; cursor: pointer; user-select: none; }
    .tray-head:hover { background: #16171c; }
    .tray-head .ico { width: 32px; height: 32px; flex: none; }
    .tray-head .ico svg { width: 100%; height: 100%; display: block; }
    .tray-body { padding: .3rem .6rem .7rem; }
    .pill { font-size: .7rem; padding: .05rem .5rem; border-radius: 9999px; background: #26272d; color: #cbd5e1; font-weight: 600; }
    .pill.new { background: #4f46e5; color: #fff; }
    .moreBtn { margin-top: .5rem; border: 1px solid #2f3038; background: #17181c; color: #cbd5e1; border-radius: .8rem; padding: .3rem .8rem; font-size: .85rem; }

    #toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); background: #27272f; color: #f1f5f9; border: 1px solid #3a3b45; padding: .55rem 1rem; border-radius: 9999px; font-size: .88rem; opacity: 0; pointer-events: none; transition: all .2s; z-index: 80; max-width: 90vw; }
    #toast.show { opacity: 1; transform: translateX(-50%); }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 antialiased">

  <!-- Login -->
  <section id="login" class="min-h-screen flex items-center justify-center p-4">
    <form id="loginForm" class="w-full max-w-sm rounded-2xl bg-slate-900 border border-slate-800 p-6 shadow-xl space-y-4">
      <div>
        <h1 class="text-2xl font-bold">Desk Alert Bridge</h1>
        <p class="text-sm text-slate-400">Enter your password to view phone alerts.</p>
      </div>
      <input id="pw" type="password" autocomplete="current-password" required placeholder="Password"
        class="w-full rounded-lg bg-slate-800 border border-slate-700 px-3 py-2 outline-none focus:ring-2 focus:ring-indigo-500" />
      <p id="loginError" class="hidden text-sm text-red-400"></p>
      <button id="loginBtn" class="w-full rounded-lg bg-indigo-600 hover:bg-indigo-500 py-2 font-semibold transition">Unlock</button>
    </form>
  </section>

  <!-- Dashboard -->
  <main id="app" class="hidden max-w-6xl mx-auto px-3 sm:px-6 pb-10" data-view="list" data-size="L">

    <!-- Sticky: incoming-call banners (every tab) + header + tabs -->
    <div class="sticky top-0 z-40 -mx-3 sm:-mx-6 px-3 sm:px-6 pt-2 pb-2 bg-slate-950/95 backdrop-blur border-b border-slate-800/70">
      <div id="callDock" class="space-y-2 empty:hidden"></div>
      <div class="flex items-center gap-2 mt-1">
        <h1 class="text-lg sm:text-xl font-bold mr-auto">Desk Alert</h1>
        <span id="status" class="text-xs px-2 py-1 rounded-full bg-slate-800 text-slate-400">Connecting…</span>
        <button id="lockBtn" class="tbtn" style="width:36px;height:36px" title="Lock" aria-label="Lock"></button>
      </div>
      <div class="flex gap-2 mt-2" role="tablist">
        <button id="tabCalls" role="tab" class="flex-1 rounded-2xl px-3 py-2 text-sm font-semibold border flex items-center justify-center gap-2"><span data-i="phone"></span>Calls <span id="cntCalls" class="pill">0</span></button>
        <button id="tabNotes" role="tab" class="flex-1 rounded-2xl px-3 py-2 text-sm font-semibold border flex items-center justify-center gap-2"><span data-i="bell"></span>Notifications <span id="cntNotes" class="pill">0</span></button>
      </div>
    </div>

    <!-- Toolbar: icon toggle buttons -->
    <div class="flex items-center gap-1.5 sm:gap-2 py-3 flex-wrap">
      <button id="bView" class="tbtn" aria-label="Layout"></button>
      <button id="bSize" class="tbtn" aria-label="Size"></button>
      <button id="bGroup" class="tbtn" aria-label="Group by app"></button>
      <span class="tsep w-px h-6 bg-slate-800 mx-1"></span>
      <button id="bSound" class="tbtn" aria-label="Sound"></button>
      <button id="bTest" class="tbtn" aria-label="Play test sounds"></button>
      <button id="bDesk" class="tbtn" aria-label="Desktop popups"></button>
      <span class="tsep w-px h-6 bg-slate-800 mx-1"></span>
      <button id="bRead" class="tbtn" aria-label="Mark all read"></button>
      <button id="bClear" class="tbtn danger" aria-label="Clear all"></button>
    </div>
    <div id="soundHint" class="hidden fixed left-1/2 -translate-x-1/2 bottom-5 z-50 rounded-full border border-amber-700 bg-amber-950/95 text-amber-200 text-sm px-4 py-2 shadow-lg pointer-events-none">Tap anywhere once to enable sound</div>

    <section id="paneCalls" class="hidden"><div id="callsOut"></div></section>
    <section id="paneNotes"><div id="notesOut"></div></section>
  </main>
  <div id="toast" role="status"></div>
<script>
(() => {
  const cfg = window.DESK_ALERT_CONFIG;
  const BASE_TITLE = 'Desk Alert Bridge';
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };

  let password = sessionStorage.getItem('da_pw') || '';
  let sb = null, channel = null, live = false, pollTimer = null, loadedOnce = false;

  // ======================= UI icons (Material paths) =======================
  const P = {
    list: 'M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z',
    grid: 'M3 3v8h8V3H3zm6 6H5V5h4v4zm-6 4v8h8v-8H3zm6 6H5v-4h4v4zm4-16v8h8V3h-8zm6 6h-4V5h4v4zm-6 4v8h8v-8h-8zm6 6h-4v-4h4v4z',
    layers: 'M11.99 18.54l-7.37-5.73L3 14.07l9 7 9-7-1.63-1.27-7.38 5.74zM12 16l7.36-5.73L21 9l-9-7-9 7 1.63 1.27L12 16z',
    vol: 'M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z',
    volOff: 'M16.5 12A4.5 4.5 0 0 0 14 7.97v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.796 8.796 0 0 0 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a8.99 8.99 0 0 0 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z',
    bell: 'M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z',
    bellOff: 'M20 18.69L7.84 6.14 5.27 3.49 4 4.76l2.8 2.8v.01c-.52.99-.8 2.16-.8 3.42v5l-2 2v1h13.73l2 2L21 19.72l-1-1.03zM12 22c1.11 0 2-.89 2-2h-4c0 1.11.89 2 2 2zm6-7.32V11c0-3.08-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68c-.15.03-.29.08-.42.12-.1.03-.2.07-.3.11h-.01c-.23.09-.46.2-.68.31L18 14.68z',
    play: 'M8 5v14l11-7z',
    doneAll: 'M18 7l-1.41-1.41-6.34 6.34 1.41 1.41L18 7zm4.24-1.41L11.66 16.17 7.48 12l-1.41 1.41L11.66 19l12-12-1.42-1.41zM.41 13.41L6 19l1.41-1.41L1.83 12 .41 13.41z',
    trash: 'M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z',
    more: 'M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z',
    less: 'M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z',
    close: 'M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z',
    lock: 'M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z',
    phone: 'M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z',
    edit: 'M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z',
  };
  const ico = (k) => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="${P[k]}"/></svg>`;
  document.querySelectorAll('[data-i]').forEach((el) => { el.innerHTML = ico(el.dataset.i); });
  $('lockBtn').innerHTML = ico('lock');

  // ======================= state =======================
  const items = new Map();                 // id -> { n, isNew, addedAt }
  const fresh = new Set();                 // ids to animate in once
  const acked = new Set();                 // ringing calls the user silenced
  const drafts = new Map();                // reply drafts by notification id
  const flipped = new Set();               // cards whose open/closed state differs from the size default
  const replying = new Set();              // cards with the reply panel open
  const replyBusy = new Set();
  const replyStatus = new Map();
  const pendingDelete = new Map();         // id -> time; stops in-flight polls from resurrecting a deleted card
  const collapsed = new Set(JSON.parse(lsGet('da_collapsed', '[]')));
  const showAll = new Set();
  const DEFAULT_QUICK = ['OK 👍', 'Thanks!', 'On my way', "I'll call you later", 'Busy right now', 'Yes', 'No'];
  let quick = DEFAULT_QUICK; try { const q = JSON.parse(lsGet('da_quick', 'null')); if (Array.isArray(q) && q.length) quick = q.map(String); } catch {}
  const ui = {
    tab: lsGet('da_tab', 'notes'), view: lsGet('da_view', 'list'), size: lsGet('da_size', 'L'), group: lsGet('da_group', 'tray'),
    sound: lsGet('da_sound', '1') === '1', desktop: lsGet('da_desktop', '0') === '1',
  };

  // ======================= API =======================
  async function api(path, method, pw, body) {
    const headers = { 'x-app-password': pw };
    if (body) headers['Content-Type'] = 'application/json';
    const res = await fetch(cfg.BACKEND_URL + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
    let data = {}; try { data = await res.json(); } catch {}
    return { ok: res.ok, status: res.status, data };
  }
  let toastT = null;
  function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }

  // ======================= classification =======================
  const isRinging = (n) => n.type === 'CALL';
  const isMissed = (n) => n.type !== 'CALL' && (/missed.*call|call.*missed/i.test(`${n.title} ${n.message}`) || /^(phone|dialer|google phone|samsung phone|call)$/i.test(n.app_name || ''));
  const isCallLike = (n) => isRinging(n) || isMissed(n);

  // ======================= app icons =======================
  const IC = window.DA_ICONS || { brands: {}, custom: {}, letters: {}, generic: {}, rules: [] };
  const RULES = (IC.rules || []).map(([re, t, k]) => [new RegExp(re, 'i'), t, k]);
  const lum = (hex) => { const r = parseInt(hex.slice(0, 2), 16), g = parseInt(hex.slice(2, 4), 16), b = parseInt(hex.slice(4, 6), 16); return (0.299 * r + 0.587 * g + 0.114 * b) / 255; };
  const NS = 'xmlns="http://www.w3.org/2000/svg"';
  const circle = (bg, inner, label) => `<svg ${NS} viewBox="0 0 32 32" role="img" aria-label="${esc(label)}"><circle cx="16" cy="16" r="16" fill="#${bg}"/>${inner}</svg>`;
  const glyph = (path, fg) => `<g transform="translate(7.84 7.84) scale(.68)"><path d="${path}" fill="${fg}"/></g>`;
  const iconCache = new Map();
  function hashHue(s) { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h % 360; }
  function hsl2hex(h, s, l) { s /= 100; l /= 100; const k = (n) => (n + h / 30) % 12, a = s * Math.min(l, 1 - l), f = (n) => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1))); return [f(0), f(8), f(4)].map((x) => Math.round(x * 255).toString(16).padStart(2, '0')).join(''); }
  function letterBadge(bg, text, label) {
    const fg = lum(bg) > 0.7 ? '#111' : '#fff'; const t = String(text).slice(0, 3); const fs = t.length > 2 ? 11 : t.length > 1 ? 13 : 16;
    return circle(bg, `<text x="16" y="16" dy=".36em" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-weight="700" font-size="${fs}" fill="${fg}">${esc(t)}</text>`, label);
  }
  function iconSvg(n) {
    if (isRinging(n)) return circle('FFFFFF', glyph(P.phone, '#dc2626'), 'Incoming call');
    const name = (n.app_name || '').trim();
    const key = (isMissed(n) ? 'missed|' : '') + name.toLowerCase();
    if (iconCache.has(key)) return iconCache.get(key);
    let svg = null;

  // ======================= realtime + polling =======================
  function setStatus(txt, cls) { const s = $('status'); s.textContent = txt; s.className = 'text-xs px-2 py-1 rounded-full ' + cls; }
  let tickWorker = null, lastPoll = 0, retryTimer = null, retryDelay = 3000, loading = false;
  function stopTicker() { if (tickWorker) { tickWorker.terminate(); tickWorker = null; } clearInterval(pollTimer); }
  function startTicker() {
    stopTicker();
    try { const url = URL.createObjectURL(new Blob(['setInterval(function(){postMessage(1)},1000)'], { type: 'text/javascript' })); tickWorker = new Worker(url); tickWorker.onmessage = tick; }
    catch { pollTimer = setInterval(tick, 1000); }
  }
  function tick() { if (password && Date.now() - lastPoll >= (live ? 8000 : 2500)) loadHistory(); }
  function scheduleRetry() { if (!password) return; clearTimeout(retryTimer); retryTimer = setTimeout(() => { if (password && !live) subscribe(); }, retryDelay); retryDelay = Math.min(retryDelay * 2, 30000); }
  function subscribe() {
    if (channel) { try { sb.removeChannel(channel); } catch {} channel = null; }
    const mine = channel = sb.channel('desk-alert-' + Date.now())
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'notifications' }, (p) => add(p.new, true))
      .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'notifications' }, (p) => { if (p.old && p.old.id) removeCard(p.old.id); else loadHistory(); })
      .subscribe((st, err) => {
        if (mine !== channel) return;
        live = (st === 'SUBSCRIBED');
        if (live) { retryDelay = 3000; clearTimeout(retryTimer); setStatus('● Live', 'bg-emerald-900 text-emerald-300'); loadHistory(); }
        else if (st === 'CHANNEL_ERROR' || st === 'TIMED_OUT' || st === 'CLOSED') {
          if (err) console.error('Realtime', st, err);
          setStatus('Reconnecting… (checking every few seconds)', 'bg-amber-900 text-amber-300'); scheduleRetry();
        }
      });
  }
  function connect() {
    loadHistory(); startTicker();
    if (!cfg.SUPABASE_ANON_KEY || /YOUR_/.test(cfg.SUPABASE_ANON_KEY)) { setStatus('Set SUPABASE_ANON_KEY in config.js (polling)', 'bg-amber-900 text-amber-300'); return; }
    sb = sb || window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY, { realtime: { worker: true, heartbeatIntervalMs: 15000 } });
    subscribe();
  }
  async function loadHistory() {
    if (loading) return; loading = true; lastPoll = Date.now();
    let r; try { r = await api('/api/history', 'GET', password); } catch { loading = false; return; }
    loading = false;
    if (r.status === 401) return logout();
    const list = r.data.items || [];
    if (loadedOnce && list.length < 100) {
      const ids = new Set(list.map((x) => x.id)), now = Date.now();
      [...items.entries()].forEach(([id, it]) => { if (!ids.has(id) && now - it.addedAt > (isRinging(it.n) ? 5000 : 20000)) removeCard(id); });
    }
    const announce = loadedOnce; loadedOnce = true;
    list.slice().reverse().forEach((n) => add(n, announce));
  }

  // ======================= session =======================
  function showApp() { $('login').classList.add('hidden'); $('app').classList.remove('hidden'); render(); connect(); }
  function logout() {
    sessionStorage.removeItem('da_pw'); password = ''; stopTicker(); clearTimeout(retryTimer); retryDelay = 3000; live = false; loadedOnce = false;
    if (channel && sb) sb.removeChannel(channel); channel = null; resetAll();
    if (ringTimer) { clearInterval(ringTimer); ringTimer = null; }
    $('app').classList.add('hidden'); $('login').classList.remove('hidden'); $('soundHint').classList.add('hidden');
  }
  $('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault(); unlock();
    const btn = $('loginBtn'), err = $('loginError'), pw = $('pw').value;
    btn.disabled = true; btn.textContent = 'Checking…'; err.classList.add('hidden');
    try {
      const r = await api('/api/verify', 'POST', pw);
      if (!r.ok) throw new Error(r.status === 401 ? 'Incorrect password.' : 'Server error. Try again.');
      password = pw; sessionStorage.setItem('da_pw', pw); $('pw').value = ''; showApp();
    } catch (ex) { err.textContent = ex.message === 'Failed to fetch' ? 'Cannot reach backend. Check BACKEND_URL.' : ex.message; err.classList.remove('hidden'); }
    finally { btn.disabled = false; btn.textContent = 'Unlock'; }
  });

  // ======================= toolbar =======================
  $('bView').addEventListener('click', () => { ui.view = ui.view === 'grid' ? 'list' : 'grid'; lsSet('da_view', ui.view); scheduleRender(); });
  $('bSize').addEventListener('click', () => { ui.size = ui.size === 'L' ? 'M' : ui.size === 'M' ? 'S' : 'L'; lsSet('da_size', ui.size); flipped.clear(); scheduleRender(); });
  $('bGroup').addEventListener('click', () => { ui.group = ui.group === 'tray' ? 'timeline' : 'tray'; lsSet('da_group', ui.group); scheduleRender(); });
  $('tabCalls').addEventListener('click', () => { ui.tab = 'calls'; lsSet('da_tab', 'calls'); scheduleRender(); });
  $('tabNotes').addEventListener('click', () => { ui.tab = 'notes'; lsSet('da_tab', 'notes'); scheduleRender(); });
  $('bSound').addEventListener('click', () => { ui.sound = !ui.sound; lsSet('da_sound', ui.sound ? '1' : '0'); unlock(); if (!ui.sound && ringTimer) { clearInterval(ringTimer); ringTimer = null; } toast(ui.sound ? 'Sound on' : 'Sound off'); scheduleRender(); });
  $('bTest').addEventListener('click', () => { unlock(); const s = ui.sound; ui.sound = true; setTimeout(() => { chimeMessage(); setTimeout(() => { chimeCall(); ui.sound = s; }, 1300); }, 80); toast('Playing message chime, then call ring'); });
  $('bDesk').addEventListener('click', async () => {
    if (!('Notification' in window)) return toast('This browser does not support popups');
    if (ui.desktop && Notification.permission === 'granted') { ui.desktop = false; lsSet('da_desktop', '0'); toast('Desktop popups off'); return scheduleRender(); }
    const p = Notification.permission === 'granted' ? 'granted' : await Notification.requestPermission();
    ui.desktop = p === 'granted'; lsSet('da_desktop', ui.desktop ? '1' : '0'); scheduleRender();
    if (p === 'denied') return toast('Popups are blocked for this site. Allow them in the browser address-bar settings.');
    if (ui.desktop) { await initSW(); popup('Desk Alert', { body: 'Desktop popups are on', tag: 'da-test', silent: true }); toast('Desktop popups on'); }
  });
  $('bRead').addEventListener('click', () => { markRead(); api('/api/read', 'POST', password).catch(() => {}); toast('All marked as read'); });
  $('bClear').addEventListener('click', async () => { if (!confirm('Delete all alert history?')) return; const r = await api('/api/clear', 'DELETE', password); if (r.ok) resetAll(); else toast('Could not clear history'); });
  $('lockBtn').addEventListener('click', logout);

  ['pointerdown', 'keydown'].forEach((ev) => window.addEventListener(ev, () => { if (ui.sound) unlock(); }, { passive: true }));
  function resync() { if (!password) return; loadHistory(); if (sb && !live) { retryDelay = 3000; subscribe(); } }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { resync(); if (document.hasFocus()) { markRead(); } } });
  window.addEventListener('focus', markRead);
  window.addEventListener('online', resync);

  updateTitle(0); initSW();
  if (password) api('/api/verify', 'POST', password).then((r) => (r.ok ? showApp() : logout())).catch(() => {});
})();
</script>
</body>
</html>
