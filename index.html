<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Desk Alert Bridge</title>
  <link id="favicon" rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3C/svg%3E" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <style>
    @keyframes callFlash {
      0%, 100% { background-color: #dc2626; box-shadow: 0 0 0 0 rgba(239,68,68,.8); }
      50%      { background-color: #7f1d1d; box-shadow: 0 0 0 14px rgba(239,68,68,0); }
    }
    .call-flash { animation: callFlash 0.9s ease-in-out infinite; border-color: #fecaca; }
    @keyframes slideIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }
    .slide-in { animation: slideIn .25s ease-out; }
    #list { display: grid; gap: .75rem; grid-template-columns: 1fr; }
    #list[data-density="large"]  { max-width: 48rem; margin: 0 auto; }
    #list[data-density="medium"] { grid-template-columns: repeat(auto-fill, minmax(20rem, 1fr)); }
    #list[data-density="small"]  { grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); gap: .5rem; }
    .card { display: flex; gap: .75rem; align-items: flex-start; border-width: 1px; border-radius: .75rem; padding: 1rem; cursor: default; }
    .card .ico { flex: none; width: 44px; height: 44px; }
    .card .ico svg { width: 100%; height: 100%; display: block; }
    .card .body { min-width: 0; flex: 1; }
    .card .meta { display: flex; align-items: center; gap: .5rem; font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; }
    .card .applabel { opacity: .85; }
    .card .pill { padding: .1rem .5rem; border-radius: 9999px; font-weight: 700; white-space: nowrap; background: #fff; color: #b91c1c; }
    .card .time { margin-left: auto; text-transform: none; letter-spacing: 0; white-space: nowrap; font-size: .85rem; font-weight: 500; }
    .card .del { border-radius: .4rem; padding: .1rem .5rem; line-height: 1.2; background: rgba(0,0,0,.3); color: #fff; }
    .card .del:hover { background: rgba(0,0,0,.6); }
    .card .title { margin-top: .25rem; font-size: 1.125rem; font-weight: 600; overflow-wrap: anywhere; }
    .card .msg { margin-top: .125rem; font-size: .875rem; opacity: .9; white-space: pre-wrap; overflow-wrap: anywhere; }
    #list[data-density="medium"] .card { padding: .65rem .75rem; gap: .6rem; }
    #list[data-density="medium"] .ico { width: 34px; height: 34px; }
    #list[data-density="medium"] .pill { font-size: .65rem; }
    #list[data-density="medium"] .title { font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #list[data-density="medium"] .msg { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; white-space: normal; }
    #list[data-density="small"] .card { padding: .4rem .55rem; gap: .5rem; border-radius: .6rem; cursor: pointer; }
    #list[data-density="small"] .ico { width: 26px; height: 26px; }
    #list[data-density="small"] .applabel { display: none; }
    #list[data-density="small"] .time { font-size: .7rem; }
    #list[data-density="small"] .pill { font-size: .6rem; padding: 0 .4rem; }
    #list[data-density="small"] .del { padding: 0 .35rem; font-size: .75rem; }
    #list[data-density="small"] .title { font-size: .85rem; margin-top: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #list[data-density="small"] .msg { font-size: .75rem; margin-top: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #list[data-density="small"] .reply { display: none; }
    #list[data-density="small"] .card.expanded .title,
    #list[data-density="small"] .card.expanded .msg { white-space: pre-wrap; overflow: visible; }
    #list[data-density="small"] .card.expanded .reply { display: flex; }
    @media (prefers-reduced-motion: reduce) { .call-flash { animation: none; background-color: #dc2626; } .slide-in { animation: none; } }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 antialiased">

  <!-- Login -->
  <section id="login" class="min-h-screen flex items-center justify-center p-4">
    <form id="loginForm" class="w-full max-w-sm rounded-2xl bg-slate-900 border border-slate-800 p-6 shadow-xl space-y-4">
      <div>
        <h1 class="text-2xl font-bold">Desk Alert Bridge</h1>
        <p class="text-sm text-slate-400">Enter your password to view phone alerts.</p>
      </div>
      <input id="pw" type="password" autocomplete="current-password" required placeholder="Password"
        class="w-full rounded-lg bg-slate-800 border border-slate-700 px-3 py-2 outline-none focus:ring-2 focus:ring-indigo-500" />
      <p id="loginError" class="hidden text-sm text-red-400"></p>
      <button id="loginBtn" class="w-full rounded-lg bg-indigo-600 hover:bg-indigo-500 py-2 font-semibold transition">Unlock</button>
    </form>
  </section>

  <!-- Dashboard -->
  <main id="app" class="hidden max-w-6xl mx-auto p-4 sm:p-6">
    <header class="flex flex-wrap items-center gap-3 mb-6">
      <h1 class="text-xl sm:text-2xl font-bold flex-1">Desk Alert Bridge</h1>
      <div id="densityBox" class="flex rounded-lg overflow-hidden border border-slate-700" role="group" aria-label="Tile size">
        <button data-d="small" title="Small tiles" class="px-3 py-1.5 text-sm transition">S</button>
        <button data-d="medium" title="Medium tiles" class="px-3 py-1.5 text-sm transition">M</button>
        <button data-d="large" title="Large tiles" class="px-3 py-1.5 text-sm transition">L</button>
      </div>
      <span id="status" class="text-xs px-2 py-1 rounded-full bg-slate-800 text-slate-400">Connecting…</span>
      <button id="readBtn" class="text-sm rounded-lg bg-slate-800 hover:bg-slate-700 px-3 py-1.5 transition">Mark all read</button>
      <button id="clearBtn" class="text-sm rounded-lg bg-red-600/20 text-red-300 hover:bg-red-600/40 px-3 py-1.5 transition">Clear history</button>
      <button id="logoutBtn" class="text-sm rounded-lg bg-slate-800 hover:bg-slate-700 px-3 py-1.5 transition">Lock</button>
    </header>
    <p id="empty" class="text-center text-slate-500 py-16">No alerts yet. Waiting for your phone…</p>
    <ul id="list" data-density="large"></ul>
  </main>

<script>
(() => {
  const cfg = window.DESK_ALERT_CONFIG;
  const BASE_TITLE = 'Desk Alert Bridge';
  const $ = (id) => document.getElementById(id);
  let password = sessionStorage.getItem('da_pw') || '';
  let sb = null, channel = null, unread = 0, audioCtx = null, live = false, pollTimer = null, loadedOnce = false;
  const seen = new Set();

  // ---------- API ----------
  async function api(path, method, pw, body) {
    const headers = { 'x-app-password': pw };
    if (body) headers['Content-Type'] = 'application/json';
    const res = await fetch(cfg.BACKEND_URL + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
    let data = {}; try { data = await res.json(); } catch {}
    return { ok: res.ok, status: res.status, data };
  }

  // ---------- Title / favicon ----------
  function updateTitle() {
    document.title = unread > 0 ? `(${unread} New) ${BASE_TITLE}` : BASE_TITLE;
    const c = document.createElement('canvas'); c.width = c.height = 32;
    const x = c.getContext('2d');
    x.fillStyle = unread ? '#dc2626' : '#4f46e5';
    x.beginPath(); x.roundRect(0, 0, 32, 32, 8); x.fill();
    if (unread) {
      x.fillStyle = '#fff'; x.font = 'bold 20px sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
      x.fillText(unread > 9 ? '9+' : String(unread), 16, 17);
    }
    $('favicon').href = c.toDataURL('image/png');
  }
  function markRead() {
    unread = 0; updateTitle();
    document.querySelectorAll('[data-new="1"]').forEach((el) => { el.dataset.new = '0'; el.querySelector('.new-dot')?.remove(); });
  }

  // ---------- Rendering ----------
  const fmt = (iso) => {
    const d = new Date(iso); if (isNaN(d)) return '';
    const t = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    return d.toDateString() === new Date().toDateString() ? t : d.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ', ' + t;
  };
  const PHONE = 'M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z';
  const ICONS = {
    call: `<svg viewBox="0 0 32 32" aria-label="Call"><circle cx="16" cy="16" r="16" fill="#fff"/><g transform="translate(6.5 6.5) scale(.8)"><path d="${PHONE}" fill="#dc2626"/></g></svg>`,
    whatsapp: `<svg viewBox="0 0 32 32" aria-label="WhatsApp"><circle cx="16" cy="16" r="16" fill="#25D366"/><path d="M16 6.5a9.5 9.5 0 0 0-8.1 14.4L6.5 25.5l4.8-1.3A9.5 9.5 0 1 0 16 6.5z" fill="#fff"/><g transform="translate(9.6 9.6) scale(.55)"><path d="${PHONE}" fill="#25D366"/></g></svg>`,
    app: `<svg viewBox="0 0 32 32" aria-label="Notification"><circle cx="16" cy="16" r="16" fill="#0ea5e9"/><g transform="translate(7 7) scale(.75)"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z" fill="#fff"/></g></svg>`,
    message: `<svg viewBox="0 0 32 32" aria-label="Message"><circle cx="16" cy="16" r="16" fill="#4f46e5"/><g transform="translate(7 7) scale(.75)"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z" fill="#fff"/></g></svg>`,
  };
  function iconFor(n) {
    const a = n.app_name || '';
    const kind = n.type === 'CALL' ? 'call' : /whatsapp/i.test(a) ? 'whatsapp' : /messag|sms|mms/i.test(a) ? 'message' : 'app';
    const d = document.createElement('div'); d.className = 'ico'; d.innerHTML = ICONS[kind]; return d;   // static strings only
  }
  function card(n, isNew) {
    const call = n.type === 'CALL';
    const li = document.createElement('li');
    li.dataset.id = n.id; li.dataset.new = isNew ? '1' : '0';
    li.dataset.ts = String(new Date(n.created_at).getTime());
    li.className = 'card slide-in ' + (call && isNew ? 'call-flash text-white' : call ? 'bg-red-950 border-red-900' : 'bg-slate-900 border-slate-800');

    const meta = document.createElement('div'); meta.className = 'meta';
    if (call) { const p = document.createElement('span'); p.className = 'pill'; p.textContent = 'Incoming call'; meta.append(p); }
    const app = document.createElement('span'); app.className = 'applabel'; app.textContent = n.app_name; meta.append(app);
    if (isNew) { const d = document.createElement('span'); d.className = 'new-dot w-2 h-2 rounded-full bg-emerald-400'; meta.append(d); }
    const time = document.createElement('span'); time.className = 'time'; time.textContent = fmt(n.created_at); meta.append(time);
    const del = document.createElement('button'); del.className = 'del'; del.textContent = '✕'; del.title = 'Delete this alert'; del.setAttribute('aria-label', 'Delete');
    del.addEventListener('click', async () => {
      del.disabled = true; li.style.opacity = '.4';
      const r = await api('/api/notification?id=' + encodeURIComponent(n.id), 'DELETE', password).catch(() => ({ ok: false }));
      if (r.ok) removeCard(n.id); else { del.disabled = false; li.style.opacity = ''; alert('Could not delete.'); }
    });
    meta.append(del);

    const h = document.createElement('div'); h.className = 'title'; h.textContent = n.title;
    const m = document.createElement('div'); m.className = 'msg'; m.textContent = n.message;
    const body = document.createElement('div'); body.className = 'body'; body.append(meta, h, m);
    if (n.can_reply && !call) body.append(replyBox(n));
    li.append(iconFor(n), body);
    // Tap: acknowledge a flashing call; in small layout also expands/collapses the tile
    li.addEventListener('click', (ev) => {
      if (ev.target.closest('input,button')) return;
      li.classList.remove('call-flash', 'text-white'); if (call) li.classList.add('bg-red-950', 'border-red-900');
      li.classList.toggle('expanded');
    });
    return li;
  }
  function replyBox(n) {
    const f = document.createElement('div'); f.className = 'reply mt-3 flex gap-2 items-center flex-wrap';
    const inp = document.createElement('input'); inp.type = 'text'; inp.placeholder = 'Reply…'; inp.maxLength = 1000;
    inp.className = 'flex-1 min-w-0 rounded-lg bg-slate-800 border border-slate-700 px-3 py-1.5 text-sm text-slate-100 outline-none focus:ring-2 focus:ring-indigo-500';
    const btn = document.createElement('button'); btn.textContent = 'Reply';
    btn.className = 'rounded-lg bg-emerald-600 hover:bg-emerald-500 px-3 py-1.5 text-sm font-semibold text-white transition disabled:opacity-50';
    const st = document.createElement('div'); st.className = 'basis-full text-xs text-slate-400';
    async function go() {
      const text = inp.value.trim(); if (!text) return;
      btn.disabled = inp.disabled = true; st.textContent = 'Sending…';
      const r = await api('/api/reply', 'POST', password, { notificationId: n.id, text }).catch(() => ({ ok: false, data: {} }));
      if (!r.ok) { st.textContent = r.data.error || 'Could not queue reply'; btn.disabled = inp.disabled = false; return; }
      for (let i = 0; i < 20; i++) {          // phone picks it up within a few seconds
        await new Promise((res) => setTimeout(res, 1500));
        const s = await api('/api/reply?id=' + encodeURIComponent(r.data.id), 'GET', password).catch(() => null);
        if (s && s.data.status === 'sent') { st.textContent = 'Sent ✓'; inp.value = ''; btn.disabled = inp.disabled = false; return; }
        if (s && s.data.status === 'failed') { st.textContent = 'Failed: ' + (s.data.error || 'unknown'); btn.disabled = inp.disabled = false; return; }
      }
      st.textContent = 'Phone did not respond (is the app running?)'; btn.disabled = inp.disabled = false;
    }
    btn.addEventListener('click', go);
    inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
    f.append(inp, btn, st); return f;
  }
  function removeCard(id) {
    const el = $('list').querySelector('[data-id="' + id + '"]');
    if (el) { if (el.dataset.new === '1' && unread > 0) { unread--; updateTitle(); } el.remove(); }
    seen.delete(id); syncEmpty();
  }
  function syncEmpty() { $('empty').classList.toggle('hidden', $('list').children.length > 0); }
  function add(n, isNew) {
    if (seen.has(n.id)) return; seen.add(n.id);
    $('list').prepend(card(n, isNew)); syncEmpty();
    if (isNew) { unread++; updateTitle(); if (n.type === 'CALL') ring(); }
  }

  // ---------- Sound (calls only) ----------
  function ring() {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      [0, 0.25, 0.5].forEach((t) => {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = 'square'; o.frequency.value = 880; g.gain.value = 0.08;
        o.connect(g); g.connect(audioCtx.destination);
        o.start(audioCtx.currentTime + t); o.stop(audioCtx.currentTime + t + 0.15);
      });
    } catch {}
  }

  // ---------- Realtime ----------
  function setStatus(txt, cls) { const s = $('status'); s.textContent = txt; s.className = 'text-xs px-2 py-1 rounded-full ' + cls; }
  // Ticker runs in a Web Worker: browsers heavily throttle timers in background tabs, workers are not throttled
  let tickWorker = null, lastPoll = 0, retryTimer = null, retryDelay = 3000, loading = false;
  function stopTicker() { if (tickWorker) { tickWorker.terminate(); tickWorker = null; } clearInterval(pollTimer); }
  function startTicker() {
    stopTicker();
    try {
      const url = URL.createObjectURL(new Blob(['setInterval(function(){postMessage(1)},1000)'], { type: 'text/javascript' }));
      tickWorker = new Worker(url); tickWorker.onmessage = tick;
    } catch { pollTimer = setInterval(tick, 1000); }
  }
  function tick() {                      // poll every 2.5s while realtime is down, every 8s as a safety net while live
    if (password && Date.now() - lastPoll >= (live ? 8000 : 2500)) loadHistory();
  }
  function scheduleRetry() {
    if (!password) return;
    clearTimeout(retryTimer);
    retryTimer = setTimeout(() => { if (password && !live) subscribe(); }, retryDelay);
    retryDelay = Math.min(retryDelay * 2, 30000);
  }
  function subscribe() {
    if (channel) { try { sb.removeChannel(channel); } catch {} channel = null; }
    const mine = channel = sb.channel('desk-alert-' + Date.now())
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'notifications' }, (p) => add(p.new, true))
      .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'notifications' }, (p) => {
        if (p.old && p.old.id) removeCard(p.old.id); else loadHistory();
      })
      .subscribe((st, err) => {
        if (mine !== channel) return;    // ignore events from a channel we already replaced
        live = (st === 'SUBSCRIBED');
        if (live) { retryDelay = 3000; clearTimeout(retryTimer); setStatus('● Live', 'bg-emerald-900 text-emerald-300'); loadHistory(); }
        else if (st === 'CHANNEL_ERROR' || st === 'TIMED_OUT' || st === 'CLOSED') {
          if (err) console.error('Realtime', st, err);
          setStatus('Reconnecting… (checking every few seconds)', 'bg-amber-900 text-amber-300');
          scheduleRetry();
        }
      });
  }
  function connect() {
    loadHistory();                       // never depend on realtime for the first paint
    startTicker();
    if (!cfg.SUPABASE_ANON_KEY || /YOUR_/.test(cfg.SUPABASE_ANON_KEY)) {
      setStatus('Set SUPABASE_ANON_KEY in config.js (polling)', 'bg-amber-900 text-amber-300'); return;
    }
    sb = sb || window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY, { realtime: { worker: true, heartbeatIntervalMs: 15000 } });
    subscribe();
  }
  async function loadHistory() {
    if (loading) return; loading = true; lastPoll = Date.now();
    let r; try { r = await api('/api/history', 'GET', password); } catch { loading = false; return; }
    loading = false;
    if (r.status === 401) return logout();
    const items = r.data.items || [];
    if (loadedOnce && items.length < 100) {      // drop cards that were deleted elsewhere (ignore very recent ones)
      const ids = new Set(items.map((x) => x.id));
      $('list').querySelectorAll('[data-id]').forEach((el) => {
        if (!ids.has(el.dataset.id) && Date.now() - Number(el.dataset.ts || 0) > 20000) removeCard(el.dataset.id);
      });
    }
    const announce = loadedOnce;         // after the first load, unseen items are genuinely new
    loadedOnce = true;
    items.slice().reverse().forEach((n) => add(n, announce)); // oldest first so newest ends on top
  }
  function resetList() { $('list').innerHTML = ''; seen.clear(); unread = 0; updateTitle(); syncEmpty(); }

  // ---------- Session ----------
  function showApp() { $('login').classList.add('hidden'); $('app').classList.remove('hidden'); connect(); }
  function logout() {
    sessionStorage.removeItem('da_pw'); password = ''; stopTicker(); clearTimeout(retryTimer); retryDelay = 3000; live = false; loadedOnce = false;
    if (channel && sb) sb.removeChannel(channel);
    channel = null; resetList();
    $('app').classList.add('hidden'); $('login').classList.remove('hidden');
  }

  $('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = $('loginBtn'), err = $('loginError'), pw = $('pw').value;
    btn.disabled = true; btn.textContent = 'Checking…'; err.classList.add('hidden');
    try {
      const r = await api('/api/verify', 'POST', pw);
      if (!r.ok) throw new Error(r.status === 401 ? 'Incorrect password.' : 'Server error. Try again.');
      password = pw; sessionStorage.setItem('da_pw', pw); $('pw').value = ''; showApp();
    } catch (ex) {
      err.textContent = ex.message === 'Failed to fetch' ? 'Cannot reach backend. Check BACKEND_URL.' : ex.message;
      err.classList.remove('hidden');
    } finally { btn.disabled = false; btn.textContent = 'Unlock'; }
  });
  $('logoutBtn').addEventListener('click', logout);
  $('readBtn').addEventListener('click', () => { markRead(); api('/api/read', 'POST', password).catch(() => {}); });
  $('clearBtn').addEventListener('click', async () => {
    if (!confirm('Delete all alert history?')) return;
    const r = await api('/api/clear', 'DELETE', password);
    if (r.ok) resetList(); else alert('Could not clear history.');
  });
  // Coming back to the tab or regaining network: catch up immediately and reconnect realtime if needed
  function resync() { if (!password) return; loadHistory(); if (sb && !live) { retryDelay = 3000; subscribe(); } }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { resync(); if (document.hasFocus()) markRead(); } });
  window.addEventListener('online', resync);
  window.addEventListener('focus', markRead);

  const DENS = ['small', 'medium', 'large'];
  function applyDensity(d) {
    if (!DENS.includes(d)) d = 'large';
    $('list').dataset.density = d;
    document.querySelectorAll('#densityBox button').forEach((b) => {
      const on = b.dataset.d === d;
      b.className = 'px-3 py-1.5 text-sm transition ' + (on ? 'bg-indigo-600 text-white' : 'bg-slate-800 hover:bg-slate-700 text-slate-300');
      b.setAttribute('aria-pressed', on);
    });
    try { localStorage.setItem('da_density', d); } catch {}
  }
  document.querySelectorAll('#densityBox button').forEach((b) => b.addEventListener('click', () => applyDensity(b.dataset.d)));
  let savedD = 'large'; try { savedD = localStorage.getItem('da_density') || 'large'; } catch {}
  applyDensity(savedD);

  updateTitle();
  if (password) api('/api/verify', 'POST', password).then((r) => r.ok ? showApp() : logout()).catch(() => {});
})();
</script>
</body>
</html>
