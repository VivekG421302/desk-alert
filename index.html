<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Desk Alert Bridge</title>
  <link id="favicon" rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3C/svg%3E" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <style>
    @keyframes callFlash {
      0%, 100% { background-color: #dc2626; box-shadow: 0 0 0 0 rgba(239,68,68,.8); }
      50%      { background-color: #7f1d1d; box-shadow: 0 0 0 14px rgba(239,68,68,0); }
    }
    .call-flash { animation: callFlash 0.9s ease-in-out infinite; border-color: #fecaca; }
    @keyframes slideIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }
    .slide-in { animation: slideIn .25s ease-out; }
    @media (prefers-reduced-motion: reduce) { .call-flash { animation: none; background-color: #dc2626; } .slide-in { animation: none; } }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 antialiased">

  <!-- Login -->
  <section id="login" class="min-h-screen flex items-center justify-center p-4">
    <form id="loginForm" class="w-full max-w-sm rounded-2xl bg-slate-900 border border-slate-800 p-6 shadow-xl space-y-4">
      <div>
        <h1 class="text-2xl font-bold">Desk Alert Bridge</h1>
        <p class="text-sm text-slate-400">Enter your password to view phone alerts.</p>
      </div>
      <input id="pw" type="password" autocomplete="current-password" required placeholder="Password"
        class="w-full rounded-lg bg-slate-800 border border-slate-700 px-3 py-2 outline-none focus:ring-2 focus:ring-indigo-500" />
      <p id="loginError" class="hidden text-sm text-red-400"></p>
      <button id="loginBtn" class="w-full rounded-lg bg-indigo-600 hover:bg-indigo-500 py-2 font-semibold transition">Unlock</button>
    </form>
  </section>

  <!-- Dashboard -->
  <main id="app" class="hidden max-w-3xl mx-auto p-4 sm:p-6">
    <header class="flex flex-wrap items-center gap-3 mb-6">
      <h1 class="text-xl sm:text-2xl font-bold flex-1">Desk Alert Bridge</h1>
      <span id="status" class="text-xs px-2 py-1 rounded-full bg-slate-800 text-slate-400">Connecting…</span>
      <button id="readBtn" class="text-sm rounded-lg bg-slate-800 hover:bg-slate-700 px-3 py-1.5 transition">Mark all read</button>
      <button id="clearBtn" class="text-sm rounded-lg bg-red-600/20 text-red-300 hover:bg-red-600/40 px-3 py-1.5 transition">Clear history</button>
      <button id="logoutBtn" class="text-sm rounded-lg bg-slate-800 hover:bg-slate-700 px-3 py-1.5 transition">Lock</button>
    </header>
    <p id="empty" class="text-center text-slate-500 py-16">No alerts yet. Waiting for your phone…</p>
    <ul id="list" class="space-y-3"></ul>
  </main>

<script>
(() => {
  const cfg = window.DESK_ALERT_CONFIG;
  const BASE_TITLE = 'Desk Alert Bridge';
  const $ = (id) => document.getElementById(id);
  let password = sessionStorage.getItem('da_pw') || '';
  let sb = null, channel = null, unread = 0, audioCtx = null;
  const seen = new Set();

  // ---------- API ----------
  async function api(path, method, pw) {
    const res = await fetch(cfg.BACKEND_URL + path, { method, headers: { 'x-app-password': pw } });
    let data = {}; try { data = await res.json(); } catch {}
    return { ok: res.ok, status: res.status, data };
  }

  // ---------- Title / favicon ----------
  function updateTitle() {
    document.title = unread > 0 ? `(${unread} New) ${BASE_TITLE}` : BASE_TITLE;
    const c = document.createElement('canvas'); c.width = c.height = 32;
    const x = c.getContext('2d');
    x.fillStyle = unread ? '#dc2626' : '#4f46e5';
    x.beginPath(); x.roundRect(0, 0, 32, 32, 8); x.fill();
    if (unread) {
      x.fillStyle = '#fff'; x.font = 'bold 20px sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
      x.fillText(unread > 9 ? '9+' : String(unread), 16, 17);
    }
    $('favicon').href = c.toDataURL('image/png');
  }
  function markRead() {
    unread = 0; updateTitle();
    document.querySelectorAll('[data-new="1"]').forEach((el) => { el.dataset.new = '0'; el.querySelector('.new-dot')?.remove(); });
  }

  // ---------- Rendering ----------
  const fmt = (iso) => new Date(iso).toLocaleString([], { hour: '2-digit', minute: '2-digit', month: 'short', day: 'numeric' });
  function card(n, isNew) {
    const call = n.type === 'CALL';
    const li = document.createElement('li');
    li.dataset.id = n.id; li.dataset.new = isNew ? '1' : '0';
    li.className = 'slide-in rounded-xl border p-4 ' + (call && isNew ? 'call-flash text-white' : call ? 'bg-red-950 border-red-900' : 'bg-slate-900 border-slate-800');
    const top = document.createElement('div'); top.className = 'flex items-center gap-2 text-xs uppercase tracking-wide opacity-80';
    const badge = document.createElement('span');
    badge.className = 'px-2 py-0.5 rounded-full font-bold ' + (call ? 'bg-white text-red-700' : 'bg-indigo-600 text-white');
    badge.textContent = call ? '📞 Incoming call' : n.app_name;
    const time = document.createElement('span'); time.className = 'ml-auto normal-case'; time.textContent = fmt(n.created_at);
    top.append(badge);
    if (call) { const a = document.createElement('span'); a.textContent = n.app_name; top.append(a); }
    if (isNew) { const d = document.createElement('span'); d.className = 'new-dot w-2 h-2 rounded-full bg-emerald-400'; top.append(d); }
    top.append(time);
    const h = document.createElement('div'); h.className = 'mt-2 text-lg font-semibold break-words'; h.textContent = n.title;
    const m = document.createElement('div'); m.className = 'mt-1 text-sm opacity-90 whitespace-pre-wrap break-words'; m.textContent = n.message;
    li.append(top, h, m);
    // Tapping a flashing call card acknowledges it
    li.addEventListener('click', () => { li.classList.remove('call-flash', 'text-white'); if (call) li.classList.add('bg-red-950', 'border-red-900'); });
    return li;
  }
  function syncEmpty() { $('empty').classList.toggle('hidden', $('list').children.length > 0); }
  function add(n, isNew) {
    if (seen.has(n.id)) return; seen.add(n.id);
    $('list').prepend(card(n, isNew)); syncEmpty();
    if (isNew) { unread++; updateTitle(); if (n.type === 'CALL') ring(); }
  }

  // ---------- Sound (calls only) ----------
  function ring() {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      [0, 0.25, 0.5].forEach((t) => {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = 'square'; o.frequency.value = 880; g.gain.value = 0.08;
        o.connect(g); g.connect(audioCtx.destination);
        o.start(audioCtx.currentTime + t); o.stop(audioCtx.currentTime + t + 0.15);
      });
    } catch {}
  }

  // ---------- Realtime ----------
  function setStatus(txt, cls) { const s = $('status'); s.textContent = txt; s.className = 'text-xs px-2 py-1 rounded-full ' + cls; }
  function connect() {
    sb = sb || window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
    channel = sb.channel('desk-alert')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'notifications' }, (p) => add(p.new, true))
      .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'notifications' }, () => resetList())
      .subscribe((s) => {
        if (s === 'SUBSCRIBED') { setStatus('● Live', 'bg-emerald-900 text-emerald-300'); loadHistory(); }
        else if (s === 'CHANNEL_ERROR' || s === 'TIMED_OUT') setStatus('Reconnecting…', 'bg-amber-900 text-amber-300');
        else if (s === 'CLOSED') setStatus('Offline', 'bg-slate-800 text-slate-400');
      });
  }
  async function loadHistory() {
    const r = await api('/api/history', 'GET', password);
    if (r.status === 401) return logout();
    (r.data.items || []).slice().reverse().forEach((n) => add(n, false)); // oldest first so newest ends on top
  }
  function resetList() { $('list').innerHTML = ''; seen.clear(); unread = 0; updateTitle(); syncEmpty(); }

  // ---------- Session ----------
  function showApp() { $('login').classList.add('hidden'); $('app').classList.remove('hidden'); connect(); }
  function logout() {
    sessionStorage.removeItem('da_pw'); password = '';
    if (channel && sb) sb.removeChannel(channel);
    channel = null; resetList();
    $('app').classList.add('hidden'); $('login').classList.remove('hidden');
  }

  $('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = $('loginBtn'), err = $('loginError'), pw = $('pw').value;
    btn.disabled = true; btn.textContent = 'Checking…'; err.classList.add('hidden');
    try {
      const r = await api('/api/verify', 'POST', pw);
      if (!r.ok) throw new Error(r.status === 401 ? 'Incorrect password.' : 'Server error. Try again.');
      password = pw; sessionStorage.setItem('da_pw', pw); $('pw').value = ''; showApp();
    } catch (ex) {
      err.textContent = ex.message === 'Failed to fetch' ? 'Cannot reach backend. Check BACKEND_URL.' : ex.message;
      err.classList.remove('hidden');
    } finally { btn.disabled = false; btn.textContent = 'Unlock'; }
  });
  $('logoutBtn').addEventListener('click', logout);
  $('readBtn').addEventListener('click', markRead);
  $('clearBtn').addEventListener('click', async () => {
    if (!confirm('Delete all alert history?')) return;
    const r = await api('/api/clear', 'DELETE', password);
    if (r.ok) resetList(); else alert('Could not clear history.');
  });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && document.hasFocus()) markRead(); });
  window.addEventListener('focus', markRead);

  updateTitle();
  if (password) api('/api/verify', 'POST', password).then((r) => r.ok ? showApp() : logout()).catch(() => {});
})();
</script>
</body>
</html>
