<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Desk Alert Bridge</title>
  <link id="favicon" rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3C/svg%3E" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="icons.js"></script>
  <style>
    :root { color-scheme: dark; }
    body { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }

    /* ---- incoming-call flash ---- */
    @keyframes callFlash {
      0%, 100% { background-color: #dc2626; box-shadow: 0 0 0 0 rgba(239,68,68,.8); }
      50%      { background-color: #7f1d1d; box-shadow: 0 0 0 14px rgba(239,68,68,0); }
    }
    .call-flash { animation: callFlash .9s ease-in-out infinite; border-color: #fecaca !important; color: #fff; }
    @keyframes slideIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
    .slide-in { animation: slideIn .25s ease-out; }
    @media (prefers-reduced-motion: reduce) { .call-flash { animation: none; background-color: #dc2626; } .slide-in { animation: none; } }

    /* ---- containers: list / grid, three sizes ---- */
    .items { display: flex; flex-direction: column; gap: .5rem; }
    #app[data-view="grid"] .items { display: grid; gap: .6rem; }
    #app[data-view="grid"][data-size="L"] .items { grid-template-columns: repeat(auto-fill, minmax(21rem, 1fr)); }
    #app[data-view="grid"][data-size="M"] .items { grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); }
    #app[data-view="grid"][data-size="S"] .items { grid-template-columns: repeat(auto-fill, minmax(11.5rem, 1fr)); gap: .45rem; }

    /* ---- card ---- */
    .card { display: flex; gap: .75rem; align-items: flex-start; border: 1px solid #1e293b; background: #0f172a; border-radius: .9rem; padding: .9rem; min-width: 0; }
    .card.is-new { border-color: #4338ca; box-shadow: inset 3px 0 0 #6366f1; }
    .card.is-missed { background: #1c0a0a; border-color: #7f1d1d; }
    .card .ico { flex: none; width: 42px; height: 42px; }
    .card .ico svg { width: 100%; height: 100%; display: block; }
    .card .main { min-width: 0; flex: 1; }
    .card .meta { display: flex; align-items: center; gap: .4rem; font-size: .72rem; color: #94a3b8; }
    .card .meta .app { text-transform: uppercase; letter-spacing: .05em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card .meta .time { margin-left: auto; white-space: nowrap; font-size: .8rem; font-weight: 500; color: #cbd5e1; }
    .card .del { border-radius: .4rem; padding: .05rem .45rem; line-height: 1.2; background: rgba(148,163,184,.15); color: #cbd5e1; }
    .card .del:hover { background: rgba(239,68,68,.45); color: #fff; }
    .card .title { margin-top: .2rem; font-size: 1.05rem; font-weight: 600; color: #f1f5f9; overflow-wrap: anywhere; }
    .card .msg { margin-top: .1rem; font-size: .875rem; color: #cbd5e1; white-space: pre-wrap; overflow-wrap: anywhere; }
    .card .dot { width: .5rem; height: .5rem; border-radius: 9999px; background: #34d399; flex: none; }

    #app[data-size="M"] .card { padding: .65rem .75rem; gap: .6rem; }
    #app[data-size="M"] .ico { width: 34px; height: 34px; }
    #app[data-size="M"] .title { font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #app[data-size="M"] .msg { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    #app[data-size="S"] .card { padding: .4rem .55rem; gap: .5rem; border-radius: .6rem; cursor: pointer; }
    #app[data-size="S"] .ico { width: 26px; height: 26px; }
    #app[data-size="S"] .app { display: none; }
    #app[data-size="S"] .meta .time { font-size: .7rem; }
    #app[data-size="S"] .del { padding: 0 .35rem; font-size: .75rem; }
    #app[data-size="S"] .title { font-size: .85rem; margin-top: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #app[data-size="S"] .msg { font-size: .75rem; margin-top: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #app[data-size="S"] .reply { display: none; }
    #app[data-size="S"] .card.expanded .title, #app[data-size="S"] .card.expanded .msg { white-space: pre-wrap; overflow: visible; display: block; }
    #app[data-size="S"] .card.expanded .reply { display: flex; }
    #app[data-view="grid"][data-size="L"] .msg { display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }

    /* ---- trays ---- */
    .tray { border: 1px solid #1e293b; background: #0b1224; border-radius: 1rem; overflow: hidden; }
    .tray-head { display: flex; align-items: center; gap: .6rem; padding: .6rem .75rem; cursor: pointer; user-select: none; }
    .tray-head:hover { background: #111a33; }
    .tray-head .ico { width: 30px; height: 30px; flex: none; }
    .tray-head .ico svg { width: 100%; height: 100%; display: block; }
    .tray-body { padding: .5rem .6rem .7rem; }
    .pill { font-size: .7rem; padding: .05rem .5rem; border-radius: 9999px; background: #1e293b; color: #cbd5e1; font-weight: 600; }
    .pill.new { background: #4f46e5; color: #fff; }

    .tray-body .card .app { display: none; }   /* the tray header already names the app */
    .tray-body .card .meta { justify-content: flex-end; }

    /* ---- seg controls ---- */
    .seg { display: inline-flex; border: 1px solid #334155; border-radius: .6rem; overflow: hidden; flex: none; }
    .seg button { padding: .3rem .65rem; font-size: .8rem; color: #cbd5e1; background: #111a33; }
    .seg button.on { background: #4f46e5; color: #fff; }
    .tool { flex: none; border-radius: .6rem; padding: .3rem .65rem; font-size: .8rem; background: #111a33; border: 1px solid #334155; color: #cbd5e1; white-space: nowrap; }
    .tool:hover { background: #1b2750; }
    .tool.on { background: #14532d; border-color: #166534; color: #bbf7d0; }
    .scrollx { overflow-x: auto; scrollbar-width: none; }
    .scrollx::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 antialiased">

  <!-- Login -->
  <section id="login" class="min-h-screen flex items-center justify-center p-4">
    <form id="loginForm" class="w-full max-w-sm rounded-2xl bg-slate-900 border border-slate-800 p-6 shadow-xl space-y-4">
      <div>
        <h1 class="text-2xl font-bold">Desk Alert Bridge</h1>
        <p class="text-sm text-slate-400">Enter your password to view phone alerts.</p>
      </div>
      <input id="pw" type="password" autocomplete="current-password" required placeholder="Password"
        class="w-full rounded-lg bg-slate-800 border border-slate-700 px-3 py-2 outline-none focus:ring-2 focus:ring-indigo-500" />
      <p id="loginError" class="hidden text-sm text-red-400"></p>
      <button id="loginBtn" class="w-full rounded-lg bg-indigo-600 hover:bg-indigo-500 py-2 font-semibold transition">Unlock</button>
    </form>
  </section>

  <!-- Dashboard -->
  <main id="app" class="hidden max-w-6xl mx-auto px-3 sm:px-6 pb-10" data-view="list" data-size="L">

    <!-- Sticky: incoming-call banners (visible on every tab) + tabs -->
    <div class="sticky top-0 z-40 -mx-3 sm:-mx-6 px-3 sm:px-6 pt-2 pb-2 bg-slate-950/95 backdrop-blur border-b border-slate-800/70">
      <div id="callDock" class="space-y-2 empty:hidden"></div>
      <div class="flex items-center gap-2 mt-1">
        <h1 class="text-lg sm:text-xl font-bold mr-auto">Desk Alert</h1>
        <span id="status" class="text-xs px-2 py-1 rounded-full bg-slate-800 text-slate-400">Connecting…</span>
        <button id="lockBtn" class="tool">Lock</button>
      </div>
      <div class="flex gap-2 mt-2" role="tablist">
        <button id="tabCalls" role="tab" class="flex-1 rounded-xl px-3 py-2 text-sm font-semibold bg-slate-900 border border-slate-800">📞 Calls <span id="cntCalls" class="pill ml-1">0</span></button>
        <button id="tabNotes" role="tab" class="flex-1 rounded-xl px-3 py-2 text-sm font-semibold bg-slate-900 border border-slate-800">🔔 Notifications <span id="cntNotes" class="pill ml-1">0</span></button>
      </div>
    </div>

    <!-- Controls -->
    <div class="scrollx flex items-center gap-2 py-3">
      <div class="seg" id="segView" title="Layout"><button data-v="list">List</button><button data-v="grid">Grid</button></div>
      <div class="seg" id="segSize" title="Size"><button data-v="S">S</button><button data-v="M">M</button><button data-v="L">L</button></div>
      <div class="seg" id="segGroup" title="Notification grouping"><button data-v="tray">Trays</button><button data-v="timeline">Timeline</button></div>
      <button id="soundBtn" class="tool">🔊 Sound</button>
      <button id="testBtn" class="tool">▶ Test</button>
      <button id="deskBtn" class="tool">🖥 Desktop alerts</button>
      <button id="readBtn" class="tool">✓ Mark all read</button>
      <button id="clearBtn" class="tool">🗑 Clear all</button>
    </div>
    <div id="soundHint" class="hidden mb-3 rounded-xl border border-amber-800 bg-amber-950/60 text-amber-200 text-sm px-3 py-2">🔇 Click anywhere on the page once to enable sound.</div>

    <section id="paneCalls" class="hidden"><div id="callsOut"></div></section>
    <section id="paneNotes"><div id="notesOut"></div></section>
  </main>

<script>
(() => {
  const cfg = window.DESK_ALERT_CONFIG;
  const BASE_TITLE = 'Desk Alert Bridge';
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };

  let password = sessionStorage.getItem('da_pw') || '';
  let sb = null, channel = null, live = false, pollTimer = null, loadedOnce = false;

  // ======================= state =======================
  const items = new Map();                 // id -> { n, isNew, addedAt }
  const fresh = new Set();                 // ids to animate in once
  const acked = new Set();                 // ringing calls the user silenced
  const drafts = new Map();                // reply drafts by notification id
  const collapsed = new Set(JSON.parse(lsGet('da_collapsed', '[]')));
  const showAll = new Set();               // trays showing every item
  const expanded = new Set();              // small cards opened
  const ui = {
    tab: lsGet('da_tab', 'notes'),
    view: lsGet('da_view', 'list'),
    size: lsGet('da_size', 'L'),
    group: lsGet('da_group', 'tray'),
    sound: lsGet('da_sound', '1') === '1',
    desktop: lsGet('da_desktop', '0') === '1',
  };

  // ======================= API =======================
  async function api(path, method, pw, body) {
    const headers = { 'x-app-password': pw };
    if (body) headers['Content-Type'] = 'application/json';
    const res = await fetch(cfg.BACKEND_URL + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
    let data = {}; try { data = await res.json(); } catch {}
    return { ok: res.ok, status: res.status, data };
  }

  // ======================= classification =======================
  const isRinging = (n) => n.type === 'CALL';
  const isMissed = (n) => n.type !== 'CALL' && (/missed.*call|call.*missed/i.test(`${n.title} ${n.message}`) || /^(phone|dialer|google phone|samsung phone|call)$/i.test(n.app_name || ''));
  const isCallLike = (n) => isRinging(n) || isMissed(n);

  // ======================= icons =======================
  const IC = window.DA_ICONS || { brands: {}, custom: {}, letters: {}, generic: {}, rules: [] };
  const RULES = (IC.rules || []).map(([re, t, k]) => [new RegExp(re, 'i'), t, k]);
  const lum = (hex) => { const r = parseInt(hex.slice(0, 2), 16), g = parseInt(hex.slice(2, 4), 16), b = parseInt(hex.slice(4, 6), 16); return (0.299 * r + 0.587 * g + 0.114 * b) / 255; };
  const NS = 'xmlns="http://www.w3.org/2000/svg"';
  const circle = (bg, inner, label) => `<svg ${NS} viewBox="0 0 32 32" role="img" aria-label="${esc(label)}"><circle cx="16" cy="16" r="16" fill="#${bg}"/>${inner}</svg>`;
  const glyph = (path, fg) => `<g transform="translate(5.6 5.6) scale(.65)"><path d="${path}" fill="${fg}"/></g>`;
  const iconCache = new Map();
  function hashHue(s) { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h % 360; }
  function hsl2hex(h, s, l) { s /= 100; l /= 100; const k = (n) => (n + h / 30) % 12, a = s * Math.min(l, 1 - l), f = (n) => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1))); return [f(0), f(8), f(4)].map((x) => Math.round(x * 255).toString(16).padStart(2, '0')).join(''); }
  function letterBadge(bg, text, label) {
    const fg = lum(bg) > 0.7 ? '#111' : '#fff'; const t = String(text).slice(0, 3); const fs = t.length > 2 ? 11 : t.length > 1 ? 13 : 16;
    return circle(bg, `<text x="16" y="16" dy=".36em" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-weight="700" font-size="${fs}" fill="${fg}">${esc(t)}</text>`, label);
  }
  function iconSvg(n) {
    if (isRinging(n)) return circle('FFFFFF', glyph(IC.generic.phone ? IC.generic.phone[1] : '', '#dc2626'), 'Incoming call');
    const name = (n.app_name || '').trim();
    const key = (isMissed(n) ? 'missed|' : '') + name.toLowerCase();
    if (iconCache.has(key)) return iconCache.get(key);
    let svg = null;
    if (isMissed(n)) svg = circle('B91C1C', glyph(IC.generic.phone[1], '#fff'), 'Missed call');
    else {
      const lc = name.toLowerCase();
      for (const [re, t, k] of RULES) {
        if (!re.test(lc)) continue;
        const e = (IC[t] || {})[k]; if (!e) continue;
        if (t === 'letters') svg = letterBadge(e[0], e[1], name);
        else svg = circle(e[0], glyph(e[1], lum(e[0]) > 0.72 ? '#111' : '#fff'), name);   // brands, custom, generic
        break;
      }
      if (!svg) svg = letterBadge(hsl2hex(hashHue(lc || 'app'), 55, 42), (name.match(/[\p{L}\p{N}]/u) || ['?'])[0].toUpperCase(), name || 'App');
    }
    iconCache.set(key, svg); return svg;
  }
  const iconDataUrl = (n) => 'data:image/svg+xml;utf8,' + encodeURIComponent(iconSvg(n));
  function iconEl(n, cls) { const d = document.createElement('div'); d.className = cls || 'ico'; d.innerHTML = iconSvg(n); return d; }   // svg built from static data + escaped text

  // ======================= sound =======================
  let actx = null, ringTimer = null, lastChime = 0;
  function audio() {
    if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); actx.onstatechange = syncHint; } catch { return null; } }
    return actx;
  }
  function unlock() { const a = audio(); if (a && a.state !== 'running') a.resume().then(syncHint).catch(() => {}); syncHint(); }
  function syncHint() { const a = actx; $('soundHint').classList.toggle('hidden', !(ui.sound && !$('app').classList.contains('hidden') && (!a || a.state !== 'running'))); }
  // bell-like note: fundamental + inharmonic partial, fast attack, exponential decay
  function bell(freq, at, dur, vol) {
    const a = audio(); if (!a || a.state !== 'running') return;
    const t0 = a.currentTime + at;
    [[1, 1], [2.76, 0.28], [5.4, 0.1]].forEach(([mult, g]) => {
      const o = a.createOscillator(), gn = a.createGain();
      o.type = 'sine'; o.frequency.value = freq * mult;
      gn.gain.setValueAtTime(0.0001, t0);
      gn.gain.exponentialRampToValueAtTime(vol * g, t0 + 0.012);
      gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(gn); gn.connect(a.destination); o.start(t0); o.stop(t0 + dur + 0.05);
    });
  }
  function chimeMessage() {              // short two-note "ding-ding"
    if (!ui.sound) return; const now = Date.now(); if (now - lastChime < 600) return; lastChime = now;
    bell(880, 0, 0.7, 0.32); bell(1318.5, 0.13, 0.9, 0.3);
  }
  function chimeCall() {                 // long (~3 s) rising phrase, repeated while a call is ringing
    if (!ui.sound) return;
    const seq = [[523.25, 0], [659.25, .24], [783.99, .48], [1046.5, .72], [783.99, 1.2], [1046.5, 1.44], [1318.5, 1.68], [1567.98, 1.92]];
    seq.forEach(([f, t]) => bell(f, t, 1.0, 0.36));
    bell(1046.5, 2.3, 1.2, 0.3); bell(1318.5, 2.3, 1.2, 0.26);
  }
  const activeCalls = () => [...items.values()].filter((x) => isRinging(x.n) && !acked.has(x.n.id)).map((x) => x.n);
  function syncRinging() {
    const ringing = activeCalls().length > 0 && ui.sound;
    if (ringing && !ringTimer) { chimeCall(); ringTimer = setInterval(() => { if (activeCalls().length) chimeCall(); else syncRinging(); }, 3600); }
    if (!ringing && ringTimer) { clearInterval(ringTimer); ringTimer = null; }
  }

  // ======================= desktop notifications =======================
  function desktopNotify(n) {
    if (!ui.desktop || !('Notification' in window) || Notification.permission !== 'granted') return;
    if (!document.hidden && document.hasFocus()) return;
    try {
      const call = isRinging(n);
      const x = new Notification(call ? '📞 Incoming call: ' + n.title : `${n.app_name}: ${n.title}`, {
        body: n.message, tag: n.id, icon: iconDataUrl(n), requireInteraction: call, silent: true,
      });
      x.onclick = () => { window.focus(); x.close(); };
    } catch {}
  }

  // ======================= title / favicon =======================
  let lastUnread = -1;
  function updateTitle(unread) {
    if (unread === lastUnread) return; lastUnread = unread;
    document.title = unread > 0 ? `(${unread} New) ${BASE_TITLE}` : BASE_TITLE;
    const c = document.createElement('canvas'); c.width = c.height = 32;
    const x = c.getContext('2d');
    x.fillStyle = unread ? '#dc2626' : '#4f46e5';
    x.beginPath(); x.roundRect(0, 0, 32, 32, 8); x.fill();
    if (unread) { x.fillStyle = '#fff'; x.font = 'bold 20px sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(unread > 9 ? '9+' : String(unread), 16, 17); }
    $('favicon').href = c.toDataURL('image/png');
  }

  // ======================= rendering =======================
  const fmt = (iso) => {
    const d = new Date(iso); if (isNaN(d)) return '';
    const t = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    return d.toDateString() === new Date().toDateString() ? t : d.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ', ' + t;
  };
  const byTime = (a, b) => new Date(b.n.created_at) - new Date(a.n.created_at);

  function markOne(id) { const it = items.get(id); if (it && it.isNew) { it.isNew = false; scheduleRender(); } }

  function card(it) {
    const n = it.n, ring = isRinging(n), missed = isMissed(n);
    const li = document.createElement('li');
    li.dataset.id = n.id;
    li.className = 'card ' + (fresh.has(n.id) ? 'slide-in ' : '') + (it.isNew ? 'is-new ' : '') + (missed ? 'is-missed ' : '') + (ring && !acked.has(n.id) ? 'call-flash ' : '') + (expanded.has(n.id) ? 'expanded' : '');
    fresh.delete(n.id);
    const main = document.createElement('div'); main.className = 'main';
    const meta = document.createElement('div'); meta.className = 'meta';
    const app = document.createElement('span'); app.className = 'app'; app.textContent = ring ? 'Incoming call · ' + n.app_name : missed ? 'Missed call · ' + n.app_name : n.app_name; meta.append(app);
    if (it.isNew) { const d = document.createElement('span'); d.className = 'dot'; meta.append(d); }
    const time = document.createElement('span'); time.className = 'time'; time.textContent = fmt(n.created_at); meta.append(time);
    const del = document.createElement('button'); del.className = 'del'; del.textContent = '✕'; del.title = 'Delete'; del.setAttribute('aria-label', 'Delete');
    del.addEventListener('click', async (e) => {
      e.stopPropagation(); del.disabled = true; li.style.opacity = '.4';
      const r = await api('/api/notification?id=' + encodeURIComponent(n.id), 'DELETE', password).catch(() => ({ ok: false }));
      if (r.ok) removeCard(n.id); else { del.disabled = false; li.style.opacity = ''; alert('Could not delete.'); }
    });
    meta.append(del);
    const title = document.createElement('div'); title.className = 'title'; title.textContent = n.title;
    const msg = document.createElement('div'); msg.className = 'msg'; msg.textContent = n.message;
    main.append(meta, title, msg);
    if (n.can_reply && !ring) main.append(replyBox(n));
    li.append(iconEl(n), main);
    li.addEventListener('click', (e) => {
      if (e.target.closest('input,button')) return;
      if (ring) acked.add(n.id);
      expanded.has(n.id) ? expanded.delete(n.id) : expanded.add(n.id);
      markOne(n.id); scheduleRender();
    });
    return li;
  }

  function replyBox(n) {
    const f = document.createElement('div'); f.className = 'reply mt-3 flex gap-2 items-center flex-wrap';
    const inp = document.createElement('input'); inp.type = 'text'; inp.placeholder = 'Reply…'; inp.maxLength = 1000; inp.dataset.replyId = n.id; inp.value = drafts.get(n.id) || '';
    inp.className = 'flex-1 min-w-0 rounded-lg bg-slate-800 border border-slate-700 px-3 py-1.5 text-sm text-slate-100 outline-none focus:ring-2 focus:ring-indigo-500';
    inp.addEventListener('input', () => drafts.set(n.id, inp.value));
    const btn = document.createElement('button'); btn.textContent = 'Reply';
    btn.className = 'rounded-lg bg-emerald-600 hover:bg-emerald-500 px-3 py-1.5 text-sm font-semibold text-white transition disabled:opacity-50';
    const st = document.createElement('div'); st.className = 'basis-full text-xs text-slate-400';
    async function go() {
      const text = inp.value.trim(); if (!text) return;
      btn.disabled = inp.disabled = true; st.textContent = 'Sending…';
      const r = await api('/api/reply', 'POST', password, { notificationId: n.id, text }).catch(() => ({ ok: false, data: {} }));
      if (!r.ok) { st.textContent = r.data.error || 'Could not queue reply'; btn.disabled = inp.disabled = false; return; }
      for (let i = 0; i < 20; i++) {
        await new Promise((res) => setTimeout(res, 1500));
        const s = await api('/api/reply?id=' + encodeURIComponent(r.data.id), 'GET', password).catch(() => null);
        if (s && s.data.status === 'sent') { st.textContent = 'Sent ✓'; inp.value = ''; drafts.delete(n.id); btn.disabled = inp.disabled = false; return; }
        if (s && s.data.status === 'failed') { st.textContent = 'Failed: ' + (s.data.error || 'unknown'); btn.disabled = inp.disabled = false; return; }
      }
      st.textContent = 'Phone did not respond (is the app running?)'; btn.disabled = inp.disabled = false;
    }
    btn.addEventListener('click', go);
    inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
    f.append(inp, btn, st); return f;
  }

  function itemsList(list) { const ul = document.createElement('ul'); ul.className = 'items'; list.forEach((it) => ul.append(card(it))); return ul; }
  const emptyMsg = (t) => { const p = document.createElement('p'); p.className = 'text-center text-slate-500 py-16'; p.textContent = t; return p; };

  function renderDock(calls) {
    const dock = $('callDock'); dock.innerHTML = '';
    calls.forEach((n) => {
      const row = document.createElement('div');
      row.className = 'call-flash rounded-2xl p-3 flex items-center gap-3 shadow-lg';
      const ico = iconEl(n, 'ico'); ico.style.cssText = 'width:46px;height:46px;flex:none';
      const txt = document.createElement('div'); txt.className = 'min-w-0 flex-1';
      txt.innerHTML = '<div class="text-xs font-bold tracking-wide uppercase opacity-90">Incoming call · <span class="a"></span></div><div class="t text-lg font-bold truncate"></div><div class="m text-sm opacity-90 truncate"></div>';
      txt.querySelector('.a').textContent = n.app_name; txt.querySelector('.t').textContent = n.title; txt.querySelector('.m').textContent = n.message;
      const b = document.createElement('button'); b.className = 'rounded-xl bg-white/90 text-red-700 font-bold px-3 py-2 text-sm hover:bg-white'; b.textContent = 'Silence';
      b.addEventListener('click', () => { acked.add(n.id); markOne(n.id); scheduleRender(); });
      row.append(ico, txt, b); dock.append(row);
    });
  }

  function renderNotes(list) {
    const out = $('notesOut'); out.innerHTML = '';
    if (!list.length) { out.append(emptyMsg('No notifications yet. Waiting for your phone…')); return; }
    if (ui.group === 'timeline') { out.append(itemsList(list)); return; }
    // trays: one per app, newest tray first
    const groups = new Map();
    list.forEach((it) => { const k = (it.n.app_name || 'Unknown').toLowerCase(); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(it); });
    const trays = document.createElement('div'); trays.className = 'space-y-3';
    [...groups.entries()].forEach(([k, arr]) => {
      const first = arr[0].n, open = !collapsed.has(k), newCount = arr.filter((x) => x.isNew).length;
      const tray = document.createElement('div'); tray.className = 'tray';
      const head = document.createElement('div'); head.className = 'tray-head';
      const name = document.createElement('div'); name.className = 'font-semibold truncate'; name.textContent = first.app_name;
      const cnt = document.createElement('span'); cnt.className = 'pill'; cnt.textContent = arr.length;
      const nw = newCount ? Object.assign(document.createElement('span'), { className: 'pill new', textContent: newCount + ' new' }) : null;
      const when = document.createElement('span'); when.className = 'ml-auto text-xs text-slate-400 whitespace-nowrap'; when.textContent = fmt(first.created_at);
      const clr = document.createElement('button'); clr.className = 'tool'; clr.textContent = 'Clear'; clr.title = 'Delete all from this app';
      clr.addEventListener('click', async (e) => {
        e.stopPropagation(); if (!confirm(`Delete all ${arr.length} from ${first.app_name}?`)) return;
        const ids = arr.map((x) => x.n.id);
        await Promise.all(ids.map((id) => api('/api/notification?id=' + encodeURIComponent(id), 'DELETE', password).then((r) => r.ok && removeCard(id)).catch(() => {})));
      });
      const chev = document.createElement('span'); chev.className = 'text-slate-400'; chev.textContent = open ? '▾' : '▸';
      head.append(iconEl(first, 'ico'), name, cnt); if (nw) head.append(nw); head.append(when, clr, chev);
      head.addEventListener('click', () => { open ? collapsed.add(k) : collapsed.delete(k); lsSet('da_collapsed', JSON.stringify([...collapsed])); scheduleRender(); });
      tray.append(head);
      if (open) {
        const body = document.createElement('div'); body.className = 'tray-body';
        const limit = 6, all = showAll.has(k), shown = all ? arr : arr.slice(0, limit);
        body.append(itemsList(shown));
        if (arr.length > limit) {
          const more = document.createElement('button'); more.className = 'tool mt-2'; more.textContent = all ? 'Show less' : `Show all ${arr.length}`;
          more.addEventListener('click', () => { all ? showAll.delete(k) : showAll.add(k); scheduleRender(); });
          body.append(more);
        }
        tray.append(body);
      }
      trays.append(tray);
    });
    out.append(trays);
  }

  function render() {
    const all = [...items.values()].sort(byTime);
    const calls = all.filter((x) => isCallLike(x.n)), notes = all.filter((x) => !isCallLike(x.n));
    const ringing = activeCalls();
    const app = $('app'); app.dataset.view = ui.view; app.dataset.size = ui.size;

    // keep focus + caret in a reply box across re-renders
    const ae = document.activeElement, focusId = ae && ae.dataset ? ae.dataset.replyId : null, caret = focusId ? ae.selectionStart : 0;

    renderDock(ringing);
    const co = $('callsOut'); co.innerHTML = ''; co.append(calls.length ? itemsList(calls) : emptyMsg('No calls yet. Incoming and missed calls show here.'));
    renderNotes(notes);

    $('paneCalls').classList.toggle('hidden', ui.tab !== 'calls'); $('paneNotes').classList.toggle('hidden', ui.tab !== 'notes');
    const tcalls = ui.tab === 'calls';
    $('tabCalls').className = 'flex-1 rounded-xl px-3 py-2 text-sm font-semibold border ' + (tcalls ? 'bg-indigo-600 border-indigo-500 text-white' : 'bg-slate-900 border-slate-800');
    $('tabNotes').className = 'flex-1 rounded-xl px-3 py-2 text-sm font-semibold border ' + (!tcalls ? 'bg-indigo-600 border-indigo-500 text-white' : 'bg-slate-900 border-slate-800');
    const newCalls = calls.filter((x) => x.isNew).length, newNotes = notes.filter((x) => x.isNew).length;
    $('cntCalls').textContent = newCalls ? newCalls + ' new' : calls.length; $('cntCalls').className = 'pill ml-1' + (newCalls ? ' new' : '');
    $('cntNotes').textContent = newNotes ? newNotes + ' new' : notes.length; $('cntNotes').className = 'pill ml-1' + (newNotes ? ' new' : '');
    document.querySelectorAll('#segView button').forEach((b) => b.classList.toggle('on', b.dataset.v === ui.view));
    document.querySelectorAll('#segSize button').forEach((b) => b.classList.toggle('on', b.dataset.v === ui.size));
    document.querySelectorAll('#segGroup button').forEach((b) => b.classList.toggle('on', b.dataset.v === ui.group));
    $('segGroup').style.display = ui.tab === 'notes' ? '' : 'none';
    $('soundBtn').textContent = ui.sound ? '🔊 Sound on' : '🔇 Sound off'; $('soundBtn').classList.toggle('on', ui.sound);
    const perm = 'Notification' in window ? Notification.permission : 'denied';
    $('deskBtn').textContent = ui.desktop && perm === 'granted' ? '🖥 Desktop alerts on' : '🖥 Desktop alerts'; $('deskBtn').classList.toggle('on', ui.desktop && perm === 'granted');

    updateTitle([...items.values()].filter((x) => x.isNew).length);
    syncRinging(); syncHint();

    if (focusId) { const el = document.querySelector(`[data-reply-id="${CSS.escape(focusId)}"]`); if (el) { el.focus(); try { el.setSelectionRange(caret, caret); } catch {} } }
  }
  let rq = false;
  function scheduleRender() { if (rq) return; rq = true; requestAnimationFrame(() => { rq = false; render(); }); }

  // ======================= data changes =======================
  function add(n, isNew) {
    if (items.has(n.id)) return;
    items.set(n.id, { n, isNew: !!isNew, addedAt: Date.now() });
    if (isNew) { fresh.add(n.id); onIncoming(n); }
    scheduleRender();
  }
  function removeCard(id) { if (!items.delete(id)) return; acked.delete(id); drafts.delete(id); expanded.delete(id); scheduleRender(); }
  function resetAll() { items.clear(); acked.clear(); drafts.clear(); expanded.clear(); fresh.clear(); scheduleRender(); }
  function onIncoming(n) {
    if (isRinging(n)) { syncRingSoon(); } else chimeMessage();
    desktopNotify(n);
  }
  function syncRingSoon() { setTimeout(syncRinging, 0); }
  function markRead() { items.forEach((it) => { it.isNew = false; }); scheduleRender(); }

  // ======================= realtime + polling =======================
  function setStatus(txt, cls) { const s = $('status'); s.textContent = txt; s.className = 'text-xs px-2 py-1 rounded-full ' + cls; }
  // Ticker in a Web Worker: browsers throttle timers in background tabs, workers are not throttled
  let tickWorker = null, lastPoll = 0, retryTimer = null, retryDelay = 3000, loading = false;
  function stopTicker() { if (tickWorker) { tickWorker.terminate(); tickWorker = null; } clearInterval(pollTimer); }
  function startTicker() {
    stopTicker();
    try {
      const url = URL.createObjectURL(new Blob(['setInterval(function(){postMessage(1)},1000)'], { type: 'text/javascript' }));
      tickWorker = new Worker(url); tickWorker.onmessage = tick;
    } catch { pollTimer = setInterval(tick, 1000); }
  }
  function tick() { if (password && Date.now() - lastPoll >= (live ? 8000 : 2500)) loadHistory(); }
  function scheduleRetry() {
    if (!password) return;
    clearTimeout(retryTimer);
    retryTimer = setTimeout(() => { if (password && !live) subscribe(); }, retryDelay);
    retryDelay = Math.min(retryDelay * 2, 30000);
  }
  function subscribe() {
    if (channel) { try { sb.removeChannel(channel); } catch {} channel = null; }
    const mine = channel = sb.channel('desk-alert-' + Date.now())
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'notifications' }, (p) => add(p.new, true))
      .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'notifications' }, (p) => { if (p.old && p.old.id) removeCard(p.old.id); else loadHistory(); })
      .subscribe((st, err) => {
        if (mine !== channel) return;
        live = (st === 'SUBSCRIBED');
        if (live) { retryDelay = 3000; clearTimeout(retryTimer); setStatus('● Live', 'bg-emerald-900 text-emerald-300'); loadHistory(); }
        else if (st === 'CHANNEL_ERROR' || st === 'TIMED_OUT' || st === 'CLOSED') {
          if (err) console.error('Realtime', st, err);
          setStatus('Reconnecting… (checking every few seconds)', 'bg-amber-900 text-amber-300');
          scheduleRetry();
        }
      });
  }
  function connect() {
    loadHistory(); startTicker();
    if (!cfg.SUPABASE_ANON_KEY || /YOUR_/.test(cfg.SUPABASE_ANON_KEY)) { setStatus('Set SUPABASE_ANON_KEY in config.js (polling)', 'bg-amber-900 text-amber-300'); return; }
    sb = sb || window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY, { realtime: { worker: true, heartbeatIntervalMs: 15000 } });
    subscribe();
  }
  async function loadHistory() {
    if (loading) return; loading = true; lastPoll = Date.now();
    let r; try { r = await api('/api/history', 'GET', password); } catch { loading = false; return; }
    loading = false;
    if (r.status === 401) return logout();
    const list = r.data.items || [];
    if (loadedOnce && list.length < 100) {      // drop cards deleted elsewhere (e.g. a call that stopped ringing); ignore ones added moments ago
      const ids = new Set(list.map((x) => x.id)), now = Date.now();
      [...items.entries()].forEach(([id, it]) => { if (!ids.has(id) && now - it.addedAt > (isRinging(it.n) ? 5000 : 20000)) removeCard(id); });
    }
    const announce = loadedOnce; loadedOnce = true;
    list.slice().reverse().forEach((n) => add(n, announce));   // oldest first so the newest ends on top
  }

  // ======================= session =======================
  function showApp() { $('login').classList.add('hidden'); $('app').classList.remove('hidden'); render(); connect(); }
  function logout() {
    sessionStorage.removeItem('da_pw'); password = ''; stopTicker(); clearTimeout(retryTimer); retryDelay = 3000; live = false; loadedOnce = false;
    if (channel && sb) sb.removeChannel(channel); channel = null; resetAll();
    if (ringTimer) { clearInterval(ringTimer); ringTimer = null; }
    $('app').classList.add('hidden'); $('login').classList.remove('hidden'); $('soundHint').classList.add('hidden');
  }

  $('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault(); unlock();                           // the click is the user gesture that lets sound play
    const btn = $('loginBtn'), err = $('loginError'), pw = $('pw').value;
    btn.disabled = true; btn.textContent = 'Checking…'; err.classList.add('hidden');
    try {
      const r = await api('/api/verify', 'POST', pw);
      if (!r.ok) throw new Error(r.status === 401 ? 'Incorrect password.' : 'Server error. Try again.');
      password = pw; sessionStorage.setItem('da_pw', pw); $('pw').value = ''; showApp();
    } catch (ex) {
      err.textContent = ex.message === 'Failed to fetch' ? 'Cannot reach backend. Check BACKEND_URL.' : ex.message; err.classList.remove('hidden');
    } finally { btn.disabled = false; btn.textContent = 'Unlock'; }
  });

  // ======================= controls =======================
  const bindSeg = (id, key, lsKey) => document.querySelectorAll(`#${id} button`).forEach((b) => b.addEventListener('click', () => { ui[key] = b.dataset.v; lsSet(lsKey, ui[key]); scheduleRender(); }));
  bindSeg('segView', 'view', 'da_view'); bindSeg('segSize', 'size', 'da_size'); bindSeg('segGroup', 'group', 'da_group');
  $('tabCalls').addEventListener('click', () => { ui.tab = 'calls'; lsSet('da_tab', 'calls'); scheduleRender(); });
  $('tabNotes').addEventListener('click', () => { ui.tab = 'notes'; lsSet('da_tab', 'notes'); scheduleRender(); });
  $('soundBtn').addEventListener('click', () => { ui.sound = !ui.sound; lsSet('da_sound', ui.sound ? '1' : '0'); unlock(); if (!ui.sound && ringTimer) { clearInterval(ringTimer); ringTimer = null; } scheduleRender(); });
  $('testBtn').addEventListener('click', () => { unlock(); const s = ui.sound; ui.sound = true; setTimeout(() => { chimeMessage(); setTimeout(() => { chimeCall(); ui.sound = s; }, 1300); }, 80); });
  $('deskBtn').addEventListener('click', async () => {
    if (!('Notification' in window)) return alert('This browser does not support desktop notifications.');
    if (ui.desktop && Notification.permission === 'granted') { ui.desktop = false; lsSet('da_desktop', '0'); return scheduleRender(); }
    const p = Notification.permission === 'granted' ? 'granted' : await Notification.requestPermission();
    ui.desktop = p === 'granted'; lsSet('da_desktop', ui.desktop ? '1' : '0');
    if (p === 'denied') alert('Notifications are blocked for this site. Allow them in your browser settings.');
    scheduleRender();
  });
  $('readBtn').addEventListener('click', () => { markRead(); api('/api/read', 'POST', password).catch(() => {}); });
  $('clearBtn').addEventListener('click', async () => { if (!confirm('Delete all alert history?')) return; const r = await api('/api/clear', 'DELETE', password); if (r.ok) resetAll(); else alert('Could not clear history.'); });
  $('lockBtn').addEventListener('click', logout);

  // first interaction anywhere unlocks audio (browsers block sound until then)
  ['pointerdown', 'keydown'].forEach((ev) => window.addEventListener(ev, () => { if (ui.sound) unlock(); }, { passive: true }));
  function resync() { if (!password) return; loadHistory(); if (sb && !live) { retryDelay = 3000; subscribe(); } }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { resync(); if (document.hasFocus()) markRead(); } });
  window.addEventListener('focus', markRead);
  window.addEventListener('online', resync);

  updateTitle(0);
  if (password) api('/api/verify', 'POST', password).then((r) => (r.ok ? showApp() : logout())).catch(() => {});
})();
</script>
</body>
</html>
